[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reckon-seo-autopilot"
version = "0.1.0"
description = "AI-native, multi-tenant SEO operations platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Reckon Technologies Ltd." },
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23,<26",
    "celery[redis]>=5.4,<6",
    "cryptography>=42,<51",
    "dnspython>=2.7,<3",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "PyJWT[crypto]>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "uvicorn>=0.32,<1",
]

[tool.setuptools.packages.find]
where = ["apps/api/src", "packages/core/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
